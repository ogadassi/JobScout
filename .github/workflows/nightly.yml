name: Nightly job scan

on:
  schedule:
    # 22:17 UTC = 00:17 Israel winter time / 01:17 summer time. GitHub often starts scheduled runs hours late
    # (so far about 8 hours), so this still lands before the morning. An odd minute avoids the top-of-hour rush.
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (write nothing, send nothing)"
        type: boolean
        default: false
      weekly:
        description: "Also send the weekly summary"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jobscout
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Run pipeline
        run: npm run pipeline -- ${{ inputs.dry_run == true && '--dry-run' || '' }} ${{ inputs.weekly == true && '--weekly' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DIGEST_CHANNEL: ${{ vars.DIGEST_CHANNEL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_MAX_JOBS: ${{ vars.CLAUDE_MAX_JOBS }}
          DIGEST_MIN_SCORE: ${{ vars.DIGEST_MIN_SCORE }}
